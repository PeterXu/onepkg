# onepkg config.toml — full example with all supported fields

# Required: package name (used for output filename and default service name)
name = "myapp"

# Required: semantic version
version = "v1.2.0"

# NOTE: Platforms are NOT configured here. Use --platform CLI flag (required).
# Example: onepkg -c config.toml --platform linux-arm64,linux-amd64,darwin-arm64

# Optional: output directory for generated installers (default: "packages")
output_dir = "dist"

# Optional: preserve file permissions in package (default: true)
# When false: normalize permissions - 0755 for executables, 0644 for others
preserve_permissions = true

# Optional: exclude patterns for filtering files from package (default: none)
# Pattern types:
#   - "tests/"     → exclude directory and all contents (prefix match)
#   - "*.md"       → exclude files matching glob at ROOT level only
#   - ".git*"      → exclude files/dirs matching prefix glob
#   - "docs/*.md"  → path-aware glob in subdirectory
exclude = ["tests/", "*.md", ".git*"]

# Required: files and directories to include in the package
# Paths are relative to the directory containing this config.toml.
# Directories are included recursively.
#
# Platform-specific files: Use {platform} marker for binaries that vary by platform.
# The marker resolves to the actual platform string (e.g., linux-arm64).
# Example: "bin/myapp.{platform}" resolves to "bin/myapp.linux-arm64" for linux-arm64,
# and packs as "bin/myapp" (marker stripped) in the final package.
# On Windows, an item that is executed (commands[].exec / services[].exec) and has
# no file extension is packed with ".exe" appended automatically, so
# "bin/myapp.{platform}" packs as "bin/myapp.exe" on windows-amd64 (the exec still
# reads "bin/myapp"). Linux/macOS pack as "bin/myapp" with no extension.
items = [
  "bin/myapp.{platform}",  # platform-specific binary (required for each --platform)
  "bin/helper.{platform}", # another platform-specific binary
  "etc/myapp.conf",        # config file (same for all platforms)
  "data/",                 # directory (recursive, same for all platforms)
]

# Optional: directories to create at install time
# Absolute paths are created as-is. Relative paths are created inside the install directory.
# Directories are created with proper ownership and permissions.
# External directories (e.g., /var/log/myapp) are NOT removed on uninstall.
dirs = [
  { path = "/var/log/myapp", owner = "myapp", mode = "0755" },  # external log directory
  { path = "data", owner = "myapp", mode = "0750" },             # relative -> inside install dir (e.g., /usr/local/myapp/data)
  { path = "/var/lib/myapp" },                                    # minimal: defaults to owner=root, mode=0755
]

# Optional: service definitions (MVP: only the first [[services]] entry is used)
# Multiple services are supported in config but post-MVP for installer generation.
[[services]]
name = "myapp"                # service name (defaults to package name)
exec = "bin/myapp"            # executable path (stripped, no {platform} marker)
args = ["--config", "etc/myapp.conf", "--log-level", "info"]  # command-line arguments
restart = "on-failure"        # restart policy: no | on-failure | always (default: "on-failure")
user = "myapp"                # run-as user (default: "root")

# Linux-specific (systemd) settings
[services.linux]
type = "simple"               # service type: simple (default), forking, notify, oneshot, exec
                              # - simple: service runs in foreground, considered started immediately
                              # - forking: service forks and parent exits (traditional daemon)
                              # - notify: service calls sd_notify when ready
                              # - oneshot: runs once and exits (for setup tasks)
                              # - exec: like simple but waits until main binary is executed
after = ["network.target", "syslog.target"]  # start after these systemd targets
restart_sec = 5               # seconds between restart attempts
working_dir = "/var/lib/myapp"  # working directory for the service (optional)
                              # Default: install directory (e.g., /usr/local/myapp)
                              # Relative paths are prepended with install dir (e.g., "data" -> /usr/local/myapp/data)
                              # Absolute paths override the default (e.g., "/var/lib/myapp")
environment = { LOG_LEVEL = "info", PORT = "8080" }  # environment variables (optional)
                              # Format: key = "value" pairs
limit_nofile = 65536          # file descriptor limit (optional)
                              # Sets both soft and hard limits

# macOS-specific (launchd) settings
[services.macos]
run_at_load = true            # start on boot
keep_alive = true             # restart on exit
working_dir = "/opt/myapp/data"  # working directory for the service (optional)
                              # Default: install directory (e.g., /opt/myapp)
                              # Relative paths are prepended with install dir (e.g., "data" -> /opt/myapp/data)
                              # Absolute paths override the default (e.g., "/opt/myapp/data")
environment = { LOG_LEVEL = "debug" }  # environment variables (optional)
                              # Format: key = "value" pairs
limit_nofile = 10240          # file descriptor limit (optional)
                              # Sets both soft and hard resource limits

# Windows-specific (Windows Service) settings
[services.windows]
start_type = "auto"            # start type: auto (default) | manual | disabled
                              # - auto: service starts at boot
                              # - manual: service starts manually or on demand
                              # - disabled: service cannot start
recovery_delay_ms = 5000       # delay before restart on failure in ms (default: 5000)
                              # Sets service recovery to restart after this delay

# Optional: system overlays — map system paths to bundled items
# At install time, if the system path exists on the target machine, the installer
# copies from the system path into the install directory instead of using the
# bundled version. If the system path does not exist, the bundled version is used.
#
# Use cases: preserve existing config files, certificates, or data directories
# across upgrades; adopt host-specific files from a known system location.
#
# Rules:
#   - "system" must be an absolute path on the target machine
#   - "item" must match an entry in items (exact match or stripped {platform} form)
#   - Works for both files and directories (directories are copied recursively)
#   - Critical system paths (e.g., /etc/passwd, /root) are rejected
#   - Path traversal (..) in system paths is rejected

# Example: use existing agent config if present, otherwise install default
# [[system_overlay]]
# system = "/etc/agent/config.txt"
# item = "etc/myapp.conf"

# Example: preserve host certificates across reinstalls
# [[system_overlay]]
# system = "/etc/myapp/certs"
# item = "data/certs"

# Example: second service (post-MVP - not yet supported by installer)
# [[services]]
# name = "myapp-worker"
# exec = "bin/myapp"
# args = ["worker", "--queue", "default"]
# restart = "always"
# user = "myapp"
#
# [services.linux]
# after = ["network.target", "myapp.service"]  # can depend on first service
# restart_sec = 10

# --- mode = "run": one-shot command/script package (Windows-only) ---
# Double-clicking the .exe runs ALL commands (continuing past failures), then
# shows a Windows MessageBox summarizing each command's result ([OK]/[FAIL] +
# exit code) and a tally, and exits 0 (all ok) or 1 (any failed).
# No install/uninstall, no service, no permanent files. Items are optional
# (omit them for shell-only packages).
# NOTE: run packages are interactive-only - the results MessageBox is modal, so
# they are not suited to scheduled/CI/unattended use (a future 'quiet' option may change this).
#
# name = "cleanup-bundle"
# version = "v1.0.0"
# mode = "run"
# require_admin = true
#
# items = [
#   "bin/cleanup.{platform}",
#   "scripts/setup.ps1",
# ]
#
# [[commands]]
# exec = "bin/cleanup"               # bundled file, resolved against the temp dir
# args = ["--all", "--force"]
#
# [[commands]]
# shell = "netsh advfirewall set allprofiles state off"   # arbitrary PowerShell
#
# [[commands]]
# exec = "scripts/setup.ps1"
# args = ["-Mode", "quick"]

# --- Windows known-folder variables (Windows-only) ---
# A curated set of built-in Windows known folders can be referenced in path
# fields and resolved on the TARGET machine at install/run time via
# [Environment]::GetFolderPath. They are NOT resolved at build time (the build
# host is macOS/Linux), so the target user's profile is used.
#
# Syntax:
#   {dst.VarName}  in path-string fields: dirs[].path, system_overlay[].system,
#                  and run-mode commands[].args AND commands[].shell
#
# Supported variables (MSI/WiX names):
#   AppDataFolder         C:\Users\<u>\AppData\Roaming
#   LocalAppDataFolder    C:\Users\<u>\AppData\Local
#   CommonAppDataFolder   C:\ProgramData
#   ProgramFilesFolder    C:\Program Files (x86)
#   ProgramFiles64Folder  C:\Program Files
#   WindowsFolder         C:\Windows
#   SystemFolder          C:\Windows\System32
#   DesktopFolder         C:\Users\<u>\Desktop
#   ProgramMenuFolder     Start Menu\Programs
#   StartupFolder         Start Menu\Programs\Startup
#   PersonalFolder        C:\Users\<u>\Documents
#   CommonDocumentsFolder C:\Users\Public\Documents
#
# Unknown names (e.g. {AppData}) fail fast at config validation.
# Marked dirs/overlay paths are Windows-only: building them for linux/darwin is
# an error. (Run mode is already Windows-only.)
#
# Install example - create a directory under the roaming AppData folder:
# [[dirs]]
# path = "{dst.AppDataFolder}\\MyApp\\data"
# mode = "0755"
#
# Install example - overlay a file from another installed app:
# [[system_overlay]]
# system = "{dst.ProgramFiles64Folder}\\OtherApp\\config.json"
# item = "config/otherapp.json"
#
# Run example - pass a resolved path as an argument (same {dst.} form in shell):
# [[commands]]
# exec = "bin/myapp.exe"
# args = ["--config", "{dst.AppDataFolder}\\MyApp\\config.json"]
#
# [[commands]]
# shell = "Copy-Item profile.json \"{dst.AppDataFolder}\\MyApp\\\""
#
# ── Cross-platform {dst.*} markers ───────────────────────────────────────────
# Four markers resolve on the TARGET at install/run time on ALL platforms
# (Linux, macOS, and Windows), spelled identically everywhere. They are
# environment/automatic variables, so no runtime definition line is emitted.
#
#   {dst.HOME}      Linux/macOS: $HOME                  Windows: $HOME
#   {dst.TMPDIR}    ${TMPDIR:-/tmp}                              $env:TEMP
#   {dst.USER}      ${USER:-$(id -un)}                           $env:USERNAME
#   {dst.HOSTNAME}  ${HOSTNAME:-$(hostname)}                     $env:COMPUTERNAME
#
# Like the Windows-only folders above, they are valid only in dirs[].path,
# system_overlay[].system, and run-mode commands[].args/.shell (and their
# <field>_<os> variants). Unlike the Windows-only folders, they are NOT
# rejected on linux/darwin builds.
#
# Run example (one command list; each platform resolves the marker itself):
# [[commands]]
# shell         = "mkdir -p {dst.TMPDIR}/diag && echo {dst.USER}@{dst.HOSTNAME}"
# shell_windows = "New-Item -ItemType Directory -Force \"$env:TEMP\\diag\" | Out-Null"

# --- Host environment variables (build-time, all platforms) ---
# {env.NAME} is replaced at BUILD time with the build host's value of the
# environment variable NAME, in EVERY string field (name, version, paths,
# args, etc.). It produces a literal in the packed config. A referenced
# variable that is unset or empty fails the build (no defaults).
#
# This is distinct from {dst.NAME} (resolved on the Windows target at
# install/run time) and from the legacy {platform} marker.
#
# version = "{env.BUILD_VERSION}"
# output_dir = "{env.DIST_DIR}"

# ── Cross-platform run-mode example ──────────────────────────────────────────
# mode = "run" builds a one-shot package. One [[commands]] list serves all
# platforms: each field's effective value is the <field>_<os> override if set,
# else the base field. {dst.HOME} resolves to $HOME on every platform.
#
# name = "diag"
# version = "v1.0.0"
# mode = "run"
# items = ["bin/diag.{platform}"]
#
# [[commands]]
# exec          = "bin/diag"            # all platforms (.exe auto-appended on Windows)
# args          = ["--check"]
# args_windows  = ["/check"]            # windows-only arg shape
#
# [[commands]]
# shell         = "mkdir -p {dst.HOME}/.config/diag"   # base (linux/macos)
# shell_windows = "New-Item -ItemType Directory -Force \"$env:APPDATA\\diag\""
