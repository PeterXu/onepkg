# onepkg config.toml — full example with all supported fields

# Required: package name (used for output filename and default service name)
name = "myapp"

# Required: semantic version
version = "v1.2.0"

# NOTE: Platforms are NOT configured here. Use --platform CLI flag (required).
# Example: onepkg -c config.toml --platform linux-arm64,linux-amd64,darwin-arm64

# Optional: output directory for generated installers (default: "packages")
output_dir = "dist"

# Optional: preserve file permissions in package (default: true)
# When false: normalize permissions - 0755 for executables, 0644 for others
preserve_permissions = true

# Optional: exclude patterns for filtering files from package (default: none)
# Pattern types:
#   - "tests/"     → exclude directory and all contents (prefix match)
#   - "*.md"       → exclude files matching glob at ROOT level only
#   - ".git*"      → exclude files/dirs matching prefix glob
#   - "docs/*.md"  → path-aware glob in subdirectory
exclude = ["tests/", "*.md", ".git*"]

# Required: files and directories to include in the package
# Paths are relative to the directory containing this config.toml.
# Directories are included recursively.
#
# Platform-specific files: Use {platform} marker for binaries that vary by platform.
# The marker resolves to the actual platform string (e.g., linux-arm64).
# Example: "bin/myapp.{platform}" resolves to "bin/myapp.linux-arm64" for linux-arm64,
# and packs as "bin/myapp" (marker stripped) in the final package.
items = [
  "bin/myapp.{platform}",  # platform-specific binary (required for each --platform)
  "bin/helper.{platform}", # another platform-specific binary
  "etc/myapp.conf",        # config file (same for all platforms)
  "data/",                 # directory (recursive, same for all platforms)
]

# Optional: directories to create at install time
# Absolute paths are created as-is. Relative paths are created inside the install directory.
# Directories are created with proper ownership and permissions.
# External directories (e.g., /var/log/myapp) are NOT removed on uninstall.
dirs = [
  { path = "/var/log/myapp", owner = "myapp", mode = "0755" },  # external log directory
  { path = "data", owner = "myapp", mode = "0750" },             # relative -> inside install dir (e.g., /usr/local/myapp/data)
  { path = "/var/lib/myapp" },                                    # minimal: defaults to owner=root, mode=0755
]

# Optional: service definitions (MVP: only the first [[services]] entry is used)
# Multiple services are supported in config but post-MVP for installer generation.
[[services]]
name = "myapp"                # service name (defaults to package name)
exec = "bin/myapp"            # executable path (stripped, no {platform} marker)
args = ["--config", "etc/myapp.conf", "--log-level", "info"]  # command-line arguments
restart = "on-failure"        # restart policy: no | on-failure | always (default: "on-failure")
user = "myapp"                # run-as user (default: "root")

# Linux-specific (systemd) settings
[services.linux]
type = "simple"               # service type: simple (default), forking, notify, oneshot, exec
                              # - simple: service runs in foreground, considered started immediately
                              # - forking: service forks and parent exits (traditional daemon)
                              # - notify: service calls sd_notify when ready
                              # - oneshot: runs once and exits (for setup tasks)
                              # - exec: like simple but waits until main binary is executed
after = ["network.target", "syslog.target"]  # start after these systemd targets
restart_sec = 5               # seconds between restart attempts
working_dir = "/var/lib/myapp"  # working directory for the service (optional)
                              # Default: install directory (e.g., /usr/local/myapp)
                              # Relative paths are prepended with install dir (e.g., "data" -> /usr/local/myapp/data)
                              # Absolute paths override the default (e.g., "/var/lib/myapp")
environment = { LOG_LEVEL = "info", PORT = "8080" }  # environment variables (optional)
                              # Format: key = "value" pairs
limit_nofile = 65536          # file descriptor limit (optional)
                              # Sets both soft and hard limits

# macOS-specific (launchd) settings
[services.macos]
run_at_load = true            # start on boot
keep_alive = true             # restart on exit
working_dir = "/opt/myapp/data"  # working directory for the service (optional)
                              # Default: install directory (e.g., /opt/myapp)
                              # Relative paths are prepended with install dir (e.g., "data" -> /opt/myapp/data)
                              # Absolute paths override the default (e.g., "/opt/myapp/data")
environment = { LOG_LEVEL = "debug" }  # environment variables (optional)
                              # Format: key = "value" pairs
limit_nofile = 10240          # file descriptor limit (optional)
                              # Sets both soft and hard resource limits

# Optional: system overlays — map system paths to bundled items
# At install time, if the system path exists on the target machine, the installer
# copies from the system path into the install directory instead of using the
# bundled version. If the system path does not exist, the bundled version is used.
#
# Use cases: preserve existing config files, certificates, or data directories
# across upgrades; adopt host-specific files from a known system location.
#
# Rules:
#   - "system" must be an absolute path on the target machine
#   - "item" must match an entry in items (exact match or stripped {platform} form)
#   - Works for both files and directories (directories are copied recursively)
#   - Critical system paths (e.g., /etc/passwd, /root) are rejected
#   - Path traversal (..) in system paths is rejected

# Example: use existing agent config if present, otherwise install default
# [[system_overlay]]
# system = "/etc/agent/config.txt"
# item = "etc/myapp.conf"

# Example: preserve host certificates across reinstalls
# [[system_overlay]]
# system = "/etc/myapp/certs"
# item = "data/certs"

# Example: second service (post-MVP - not yet supported by installer)
# [[services]]
# name = "myapp-worker"
# exec = "bin/myapp"
# args = ["worker", "--queue", "default"]
# restart = "always"
# user = "myapp"
#
# [services.linux]
# after = ["network.target", "myapp.service"]  # can depend on first service
# restart_sec = 10
